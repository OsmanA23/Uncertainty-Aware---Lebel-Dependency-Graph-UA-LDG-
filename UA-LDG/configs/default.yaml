# ============================================================
#  configs/default.yaml
#  UA-LDG: Master configuration file
#  All hyperparameters in one place — override via CLI:
#    python scripts/train.py --config configs/default.yaml
#                            training.lr=5e-5 model.kappa=20
# ============================================================

# ── Dataset ──────────────────────────────────────────────────────────────────
data:
  primary_dataset: mimic_cxr            # mimic_cxr | chestxray14 | chexpert
  data_root: data/raw
  processed_root: data/processed
  splits_root: data/splits
  image_size: 224
  num_workers: 4
  pin_memory: true

  # ── MIMIC-CXR-JPG v2.0.0 (PRIMARY DATASET) ───────────────────────────────
  # Folder structure: <root>/files/p{prefix}/p{subject_id}/s{study_id}/<dicom_id>.jpg
  # CSV files are auto-detected as .csv.gz or .csv
  mimic_cxr:
    root: data/raw/mimic-cxr-jpg              # contains files/ and all .csv.gz files
    image_dir: data/raw/mimic-cxr-jpg/files   # nested image root
    split_csv: data/raw/mimic-cxr-jpg/mimic-cxr-2.0.0-split.csv.gz
    label_csv: data/raw/mimic-cxr-jpg/mimic-cxr-2.0.0-chexpert.csv.gz
    metadata_csv: data/raw/mimic-cxr-jpg/mimic-cxr-2.0.0-metadata.csv.gz
    uncertain_policy: ignore                  # negative | positive | ignore
    frontal_only: true                        # keep only PA and AP views
    validate_images: false                    # if true, drop missing/corrupt images from the split

  # ── NIH ChestX-ray14 (optional cross-dataset) ─────────────────────────────
  chestxray14:
    image_dir: data/raw/chestxray14/images
    label_file: data/raw/chestxray14/Data_Entry_2017.csv
    train_val_list: data/raw/chestxray14/train_val_list.txt
    test_list: data/raw/chestxray14/test_list.txt

  # ── Stanford CheXpert (optional cross-dataset) ────────────────────────────
  chexpert:
    image_dir: data/raw/chexpert
    train_csv: data/raw/chexpert/train.csv
    valid_csv: data/raw/chexpert/valid.csv

# ── Pathology classes (MIMIC-CXR-JPG native labels) ─────────────────────────
# Uses MIMIC-CXR's own CheXpert label names directly.
# Meta-labels (No Finding, Support Devices) are excluded.
pathologies:
  - Atelectasis                # 0
  - Cardiomegaly               # 1
  - Consolidation              # 2
  - Edema                      # 3
  - Enlarged Cardiomediastinum # 4
  - Fracture                   # 5
  - Lung Lesion                # 6
  - Lung Opacity               # 7
  - Pleural Effusion           # 8
  - Pneumonia                  # 9
  - Pneumothorax               # 10
  - Pleural Other              # 11

# ── Model ────────────────────────────────────────────────────────────────────
model:
  # Visual backbone
  backbone: densenet121                         # densenet121 | resnet50 | vit_b_16
  backbone_pretrained: true
  backbone_pretrained_source: torchxrayvision   # "imagenet" | "torchxrayvision"
  backbone_freeze_bn: true
  image_embed_dim: 1024                         # DenseNet-121 output channels

  # Label embeddings
  label_embed_dim: 200                  # BioWordVec dimension
  label_embed_path: data/processed/biowordvec_200d.bin
  node_hidden_dim: 512                  # d_h in paper

  # Beta-Binomial edge weights
  cooccurrence_threshold: 100           # minimum co-occurrences for an edge to exist

  # Uncertainty-aware GCN
  gcn_layers: 2
  gcn_dropout: 0.3
  gamma: 5.0                            # uncertainty suppression strength in GCN attention gate

  # Attention gate
  use_attention_gate: true

  # Evidential head
  edl_hidden_dim: 256

# ── Training ─────────────────────────────────────────────────────────────────
training:
  epochs: 35
  batch_size: 32
  lr: 1.0e-4
  weight_decay: 1.0e-4
  lr_scheduler: plateau                 # plateau | cosine | step
  lr_patience: 7                        # for plateau scheduler
  lr_factor: 0.3
  min_lr: 1.0e-7
  grad_clip: 1.0

  # Loss weights
  lambda_edl: 0.05                      # was 0.005 — too small; EDL contributed <0.1% of loss
  asym_gamma_neg: 4                     # Asymmetric loss negative focusing
  asym_gamma_pos: 0

  # Augmentation
  random_hflip: true
  random_rotation: 10                   # degrees
  color_jitter: false

  # Checkpointing
  save_dir: outputs/checkpoints
  save_every: 5                         # save checkpoint every N epochs
  early_stopping_patience: 10

  # Reproducibility
  seed: 42

# ── Evaluation ───────────────────────────────────────────────────────────────
evaluation:
  metrics:
    - auc_roc
    - average_precision
    - f1_macro
    - ece                               # Expected Calibration Error
  num_bins_ece: 15
  threshold: 0.3                        # for F1 binarisation (lowered from 0.5 for imbalanced data)

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  log_dir: outputs/logs
  use_tensorboard: true
  use_wandb: false
  wandb_project: ua_ldg
  log_every: 50                         # steps

# ── Hardware ─────────────────────────────────────────────────────────────────
hardware:
  device: cuda                          # cuda | cpu
  num_gpus: 1
  mixed_precision: true                 # fp16 training (requires GPU)
